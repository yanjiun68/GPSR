test_publisher:
  ros__parameters:
    # Set this to the topic you want the troubleshooting publisher to publish.
    topic: /test_tools/output
    # Match this to the topic message type, for example std_msgs/msg/String.
    message_type: std_msgs/msg/String
    # Set fields for the outgoing message using YAML syntax.
    message_yaml: "data: 'test message'"
    rate_hz: 1.0
    publish_once: false
    qos_depth: 10
    qos_reliability: reliable
    qos_durability: volatile

test_subscriber:
  ros__parameters:
    # Add the topics you want to inspect during troubleshooting.
    topics:
      - /test_tools/output
    # Add the matching message type for each topic above, in the same order.
    message_types:
      - std_msgs/msg/String
    qos_depth: 10
    qos_reliability: reliable
    qos_durability: volatile
