# Section: Strategy 2B search policy using only recorded gpsr_waypoint.yaml names.
rooms:
  kitchen:
    viewpoints: [kitchen]
  dining_room:
    viewpoints: [dining_room]
  living_room:
    viewpoints: [living_room]
  bedroom:
    viewpoints: [bedroom]
  entrance:
    viewpoints: [entrance]

# Section: Repeat one complete object-search route only after a NOT_FOUND result.
# Infrastructure, timeout, cancellation, and perception failures do not consume
# this semantic retry. A value of 1 means two complete passes at most.
retry:
  max_not_found_retries: 1

# Section: Object aliases, categories, members, detector labels, and priors live in object_knowledge.yaml.

# Section: Search every object location with three complete rotations. Angles are
# desired offsets from the arrival heading, not raw wheel commands. Keeping the
# headings cumulative makes each adjacent Nav2 Spin request a positive 60-degree
# step, including when a new round crosses the arrival heading.
scan:
  fast_angles_deg: [0, 60, 120, 180, 240, 300, 360, 420, 480, 540, 600, 660, 720, 780, 840, 900, 960, 1020, 1080]
  # Section: LOCAL scope uses three full circles of small relative Nav2 Spin increments.
  local_step_deg: 15.0
  local_max_yaw_deg: 1080.0
  extended_angles_deg: []
  exhaustive_angles_deg: []
  settle_interval_sec: 0.5
  action_timeout_sec: 20.0

# Section: Sliding-window stationary target verification.
verification:
  window_frames: 5
  minimum_hits: 3
  min_confidence: 0.35
  last_seen_timeout_sec: 1.0
  confirmation_timeout_sec: 3.0
  perception_startup_timeout_sec: 20.0

# Section: Aligned-depth projection and TF freshness safeguards.
localization:
  map_frame: map
  base_frame: base_link
  camera_frame: camera_color_optical_frame
  depth_roi_width_px: 20
  depth_roi_height_px: 20
  min_valid_depth_ratio: 0.5
  min_range_m: 0.15
  max_range_m: 6.0
  max_detection_age_sec: 0.75
  max_depth_age_sec: 0.75
  max_timestamp_skew_sec: 0.35
  tf_timeout_sec: 0.3

# Section: Collision-safe candidate generation and Nav2 planner validation.
approach:
  default_stand_off_distance_m: 0.8
  candidate_angles_deg: [180, 135, -135, 90, -90, 45, -45, 0]
  costmap_lethal_threshold: 252
  planner_timeout_sec: 5.0
  navigation_timeout_sec: 90.0

# Section: Named navigation remains Nav2-owned through NavigateNamedPose.
navigation:
  server_timeout_sec: 5.0
  result_timeout_sec: 120.0
