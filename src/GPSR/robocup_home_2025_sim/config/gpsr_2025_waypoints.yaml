# Named GPSR destinations for the RoboCup@Home 2025 maps.
# The originally proposed (-1,-3), (-2.1,-1.4), (2.5,1), and (-2.1,2)
# positions touch occupied reference-map cells.  These replacements are in the
# same intended zones, connected through free space, and have >=0.35 m static
# clearance for the 0.30 m radius footprint. Headings face the room objects.
waypoints:
  - id: instruction_point
    name: instruction_point
    frame_id: map
    pose:
      position: {x: -2.06, y: -0.72, z: 0.0}
      orientation: {x: 0.0, y: 0.0, z: 0.0, w: 1.0}
  - id: living_room
    name: living_room
    frame_id: map
    pose:
      position: {x: -2.60, y: -0.60, z: 0.0}
      orientation: {x: 0.0, y: 0.0, z: -0.377, w: 0.926}
  - id: kitchen
    name: kitchen
    frame_id: map
    pose:
      position: {x: 1.00, y: -1.40, z: 0.0}
      orientation: {x: 0.0, y: 0.0, z: 0.707, w: 0.707}
  - id: bedroom
    name: bedroom
    frame_id: map
    pose:
      position: {x: -2.40, y: 0.85, z: 0.0}
      orientation: {x: 0.0, y: 0.0, z: 0.383, w: 0.924}
  - id: dining_room
    name: dining_room
    frame_id: map
    pose:
      position: {x: 1.00, y: 1.25, z: 0.0}
      orientation: {x: 0.0, y: 0.0, z: 0.735, w: 0.678}
