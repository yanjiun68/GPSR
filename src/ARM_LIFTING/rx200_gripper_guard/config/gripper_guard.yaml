# Section: Conservative software-derived defaults still require physical calibration.
rx200_gripper_guard:
  ros__parameters:
    robot_name: "rx200"

    topics:
      joint_states: "/rx200/sdk_joint_states"
      gripper_command: "/rx200/commands/joint_single"
      diagnostics: "/rx200/gripper_guard/diagnostics"
      contact: "/rx200/gripper_guard/contact"

    services:
      get_motor_registers: "/rx200/get_motor_registers"

    actions:
      close_until_contact: "/rx200/gripper_guard/close_until_contact"

    joints:
      motor_joint: "gripper"
      finger_joint: "left_finger"
      right_finger_joint: "right_finger"

    control:
      # Preserve the deployed grasp_params.yaml close strength and direction.
      default_close_pwm: -75.0
      default_hold_pwm: 0.0
      command_period_sec: 0.05
      min_pwm: -200.0
      max_pwm: 200.0
      max_close_pwm_magnitude: 75.0
      # The startup mode file and runtime Operating_Mode register must both indicate PWM.
      command_mode: "pwm"
      expected_operating_mode: 16

    contact:
      required_samples: 3
      # Motor velocity is rad/s; per-sample motor position progress is radians.
      velocity_threshold: 0.02
      position_span_threshold: 0.003
      # Driver effort/load is estimated, so this remains secondary evidence only.
      load_delta_threshold: 10.0
      require_load_confirmation: false
      # Left-finger displacement margin in metres above the modeled closed limit.
      aperture_margin: 0.001
      history_length: 3

    calibration:
      # Left-finger displacement in metres; RX200 URDF closed limit is 0.015 m.
      empty_closed_aperture: 0.015

    safety:
      # Five missed samples at the configured 20 Hz feedback rate.
      feedback_timeout_sec: 0.25
      action_timeout_sec: 5.0
      stop_pwm: 0.0

    health:
      enabled: true
      fast_update_rate_hz: 10.0
      medium_update_rate_hz: 2.0
      slow_update_rate_hz: 0.2
      critical_status_timeout_sec: 0.5
