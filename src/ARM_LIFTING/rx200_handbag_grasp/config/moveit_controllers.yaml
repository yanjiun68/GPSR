# MoveIt Controllers Configuration for RX200 + Lift
# ROS2 param file format - loaded directly by move_group node
# Format matches lift_moveit_config/demo.launch.py pattern

move_group:
  ros__parameters:
    trajectory_execution:
      allowed_execution_duration_scaling: 1.2
      allowed_goal_duration_margin: 0.5
      allowed_start_tolerance: 0.01

    moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

    moveit_simple_controller_manager:
      controller_names:
        - rx200/arm_controller
        - rx200/gripper_controller
        - lift_controller

      rx200/arm_controller:
        type: FollowJointTrajectory
        action_ns: follow_joint_trajectory
        default: true
        joints:
          - waist
          - shoulder
          - elbow
          - wrist_angle
          - wrist_rotate

      rx200/gripper_controller:
        type: FollowJointTrajectory
        action_ns: follow_joint_trajectory
        default: true
        joints:
          - left_finger

      lift_controller:
        type: FollowJointTrajectory
        action_ns: follow_joint_trajectory
        default: true
        joints:
          - lift_joint

