# Kinematics solvers for planning groups
# OPTIMIZED: Higher timeout and resolution for better IK success rate

interbotix_arm:
  kinematics_solver: lma_kinematics_plugin/LMAKinematicsPlugin
  kinematics_solver_search_resolution: 0.002  # was 0.005 — higher resolution
  kinematics_solver_timeout: 0.1              # was 0.05 — more time for 5-DOF
  kinematics_solver_attempts: 5               # multiple attempts for robustness
  position_only_ik: true

interbotix_gripper:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05

interbotix_lift:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05

interbotix_arm_lift:
  kinematics_solver: lma_kinematics_plugin/LMAKinematicsPlugin
  kinematics_solver_search_resolution: 0.002  # was 0.005
  kinematics_solver_timeout: 0.15             # was 0.1 — more time for 6-DOF
  kinematics_solver_attempts: 5
  position_only_ik: true
