/**/controller_manager:
  ros__parameters:
    update_rate: 50
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    motor_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/**/joint_state_broadcaster:
  ros__parameters:
    joints:
      - head_yaw_joint
      - head_pitch_joint
    interfaces:
      - position
      - velocity
      - effort

/**/motor_controller:
  ros__parameters:
    joints:
      - head_yaw_joint
      - head_pitch_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.03
      head_yaw_joint:
        trajectory: 0.12
        goal: 0.04
      head_pitch_joint:
        trajectory: 0.12
        goal: 0.04
