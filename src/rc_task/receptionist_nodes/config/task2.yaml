# task2.yaml — Receptionist Phase 2 单一参数源
#
# 用途：被 task2_receptionist.launch.py 加载，统一覆盖各节点的运行时参数。
# 路径策略：所有可执行 / 模型路径都默认空字符串，由 launch 通过 LaunchArguments
#          或环境变量解析（路径为空时各节点自己 fallback）。
# 阈值：face_threshold (识别) 默认 0.45，profile_capture 注册稳定性阈值 0.55。

face_perception_node:
  ros__parameters:
    image_topic: "/camera/rx200_camera/color/image_raw"
    face_topic: "/perception/largest_face"
    det_score_threshold: 0.65
    ctx_id: 0

appearance_node:
  ros__parameters:
    image_topic: "/camera/rx200_camera/color/image_raw"
    face_topic: "/perception/largest_face"
    appearance_topic: "/appearance/current_estimate"
    debug_topic: "/perception/appearance"
    yolo_conf_threshold: 0.4
    # Phase 2: 小脸阈值（像素面积），低于此值用 YOLO person 框作为衣服 ROI 回退
    min_face_area_px2: 1500.0

profile_capture_node:
  ros__parameters:
    face_topic: "/perception/largest_face"
    appearance_topic: "/appearance/current_estimate"
    guest_profile_topic: "/dialogue/current_guest_profile"
    host_profile_topic: "/dialogue/current_host_profile"
    status_topic: "/appearance/current_capture_status"
    snapshot_service_name: "/appearance/capture_profile_snapshot"
    snapshot_json_topic: "/appearance/captured_profile_json"
    action_name: "/appearance/capture_named_profile"
    # 5-10 帧均值（max(12, min_stable_samples) 是窗口上限；min_stable_samples 是触发完成阈值）
    min_stable_samples: 8
    embedding_similarity_threshold: 0.55
    center_tolerance_px: 40.0
    area_ratio_tolerance: 0.35
    feedback_period_sec: 0.2

# 识别节点（Batch 3 会启用 fallback_priority）
profile_identification_node:
  ros__parameters:
    face_topic: "/perception/largest_face"
    appearance_topic: "/appearance/current_estimate"
    action_name: "/appearance/recognize_human_id"
    # 默认识别阈值 0.45（规范要求）
    recognition_threshold: 0.45
    # 识别失败回退顺序：face → clothes_color → register_order → seat_position
    fallback_priority: ["face", "clothes_color", "register_order", "seat_position"]

dialogue_action_server:
  ros__parameters:
    action_name: "/dialogue/collect_guest_profile"
    profile_topic: "/dialogue/current_guest_profile"
    profile_json_topic: "/dialogue/current_guest_profile_json"
    store_profile_in_memory: true
    set_current_guest_service: "/guest_memory/set_current_guest_profile"
    # Phase 2: 路径默认空字符串，由 launch 注入或本地 fallback
    piper_bin: ""
    piper_model_path: ""
    whisper_model: "base"
    whisper_language: "en"
    mic_device: "auto"
    speaker_device: "auto"
    audio_device_candidates: "default,pulse,pipewire"
    record_sec: 4.0
    enable_tts_prompts: true
    recording_beep_enabled: true
    recording_beep_frequency_hz: 880.0
    recording_beep_duration_sec: 0.18

introduction_node:
  ros__parameters:
    piper_model_path: ""
    prefer_tts_action: true
    tts_action_name: "/tts/speak"
    tts_action_timeout_sec: 1.0

tts_bridge_node:
  ros__parameters:
    piper_model_path: ""

guest_profile_memory_bridge:
  ros__parameters:
    profile_topic: "/dialogue/current_guest_profile"
    set_current_guest_service: "/guest_memory/set_current_guest_profile"

host_profile_memory_bridge:
  ros__parameters:
    profile_topic: "/dialogue/current_host_profile"
    set_host_service: "/guest_memory/set_host_profile"

# Phase 2: 唯一 guest_memory（memory_prototype，JSON 持久化）
guest_memory_node:
  ros__parameters:
    json_path: "~/.ros/rc_task/guest_memory.json"
    enable_json_persistence: true
    appearance_json_write_period_sec: 1.0
    appearance_topic: "/appearance/current_estimate"
    default_host_name: "Host"
    default_host_drink: "tea"
    default_host_hometown: "living room"

piper_tts_node:
  ros__parameters:
    action_name: "/tts/speak"
    piper_executable: ""
    model_path: ""
    config_path: ""
    sample_rate: 22050
    speaker_id: 0
    use_cuda: false

guest_text_renderer:
  ros__parameters:
    target_topic: "/guest_profile/target"
    guest_name_topic: "/guest_profile/guest_name"
    age_topic: "/guest_profile/age"
    favourite_drink_topic: "/guest_profile/favourite_drink"
    shirt_color_topic: "/guest_profile/shirt_color"
    item1_topic: "/guest_profile/item1"
    item2_topic: "/guest_profile/item2"
    item3_topic: "/guest_profile/item3"
    item4_topic: "/guest_profile/item4"
    trigger_topic: "/guest_profile/ready"
    auto_render_on_update: false
    render_delay_sec: 0.2
    action_name: "/tts/speak"
    template: "Hi {target}, this is {guest_name}, {guest_name} likes {favourite_drink}, {guest_name} is {age} years old, {guest_name} wears a {shirt_color}, has {item1}, {item2}, {item3}, {item4}."

# 导航 / 椅子 / 已就座管理（保留导航）
nav_controller_node:
  ros__parameters:
    nav2_action_name: "/navigate_to_pose"
    amcl_pose_topic: "/amcl_pose"

chair_manager_node:
  ros__parameters:
    detections_topic: "/cam_detections"

seated_people_node:
  ros__parameters:
    detections_topic: "/cam_detections"

seat_pointing_node:
  ros__parameters:
    joint_single_topic: "/rx200/commands/joint_single"
    command_pause_sec: 1.0

# YASMIN 主控
supervisor_node:
  ros__parameters:
    target_guest_count: 2
    auto_start: false
    auto_start_target_guest_count: 2
    dry_run: false
    debug_mode: false
    save_memory_path: "~/.ros/rc_task/guest_memory.json"
    # 规范全局参数
    use_camera_topic: "/camera/rx200_camera/color/image_raw"
    face_threshold: 0.45
    max_guests: 2
    use_voice_input: true
    startup_nano_d2_topic: "/nano_d2_grounded"
    # TTS profile 话题（与 RobotClients.TTS_PROFILE_FIELDS 对齐）
    tts_target_topic: "/guest_profile/target"
    tts_guest_name_topic: "/guest_profile/guest_name"
    tts_age_topic: "/guest_profile/age"
    tts_favourite_drink_topic: "/guest_profile/favourite_drink"
    tts_shirt_color_topic: "/guest_profile/shirt_color"
    tts_item1_topic: "/guest_profile/item1"
    tts_item2_topic: "/guest_profile/item2"
    tts_item3_topic: "/guest_profile/item3"
    tts_item4_topic: "/guest_profile/item4"
    tts_ready_topic: "/guest_profile/ready"
    tts_ready_delay_sec: 0.1
    dialogue_mic_device: "auto"
    dialogue_record_sec: 4.0
    dialogue_piper_model_path: ""
    dialogue_whisper_model: "base"
    dialogue_whisper_language: "en"
