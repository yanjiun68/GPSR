slam_toolbox:
  ros__parameters:
    # ✅ 调整最小激光范围，与nav2_params一致
    min_laser_range: 0.25   # 与激光雷达驱动的range_min一致
    # Solver Params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    use_sim_time: false
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint 
    scan_topic: /scan
    use_map_saver: true
    mode: localization   # mapping (建好图后切localization，避免继续改地图)

    # Mapping Params
    # 2D SLAM specific
    # map_file_name: test_map
    # Start mapping from scratch; do not deserialize a previous pose graph.
    map_start_at_dock: false

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.05 #if 0 never publishes odometry
    map_update_interval: 0.3        # 原0.1 - 每秒更新一次地图，避免过于频繁（地图跳动/抖就调大，想要地图更新快就调小）
    resolution: 0.05                # 原0.01 - 5cm分辨率更合理（建图卡顿就调大，需要精细就调小）
    max_laser_range: 12.0 #for rastering images     （空旷场景可略增；玻璃/远距噪声大就减小）
    minimum_time_interval: 0.05
    transform_timeout: 0.8 #原0.2 - 用户建议0.8，宽容每一帧的延迟 （调大：更容忍TF延迟不易报错， 调小：实时性强，但容易timeout）
    tf_buffer_duration: 60.0 #原30.0  (同transform_timeout)
    stack_size_to_use: 80000000 #(40000000)program needs a larger stack size to serialize large maps
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    use_median: false
    minimum_travel_distance: 0.10          # 更强抑制微抖动造成的地图拖影   （原地抖动导致墙体重影就调大，
    minimum_travel_heading: 0.08           # 降低小角度噪声带来的误匹配      低速探索时地图断续就调小）
    scan_buffer_size: 50
    scan_buffer_maximum_scan_distance: 12.0
    link_match_minimum_response_fine: 0.35   # (地图错位/扭曲时提高；特征稀疏环境匹配不上可略降。)
    link_scan_maximum_distance: 2.0
    loop_search_maximum_distance: 1.5     # (调大：更容易发现闭环，但误匹配风险上升,调小：更稳更快，但可能漏闭环。)
    loop_search_minimum_chain_size: 5
    loop_search_maximum_key_frames: 200
    loop_search_space_radius: 12.0        # （同loop_search_maximum_distance,大场景回环困难可适当调大）
    loop_minimum_score: 0.45     # (回到旧区域却不闭环可降低一点；出现地图“折叠/跳变”就提高。)
    use_scan_registration: true
    do_loop_closing: true

    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.1
    correlation_search_space_resolution: 0.005
    correlation_search_space_smear_deviation: 0.05 

    # Correlation Parameters - Loop Closure Parameters
    # loop_search_space_dimension: 8.0
    # loop_search_space_resolution: 0.05
    # loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 1.0      # (对“位移/角度变化过大”的惩罚,
    angle_variance_penalty: 3.0         #  有里程计噪声时通常适当提高角度惩罚)

    fine_search_angle_offset: 0.0001    
    coarse_search_angle_offset: 0.2        # 适当收紧，减少大角度误匹配 (快速转向后匹配丢失可增范围；CPU紧张反向调。)
    coarse_angle_resolution: 0.005                                # (快速转向后匹配丢失可减步长；CPU紧张反向调。)
    minimum_angle_penalty: 1.0
    minimum_distance_penalty: 0.8
    use_response_expansion: true
