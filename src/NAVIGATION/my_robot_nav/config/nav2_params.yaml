amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.3
    alpha2: 0.3
    alpha3: 0.3
    alpha4: 0.3
    alpha5: 0.1
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 3000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 2
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan_filtered

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 50
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    # Section: lidar_loc_nav.launch.py injects the installed package BT XML path at runtime.
    default_nav_through_poses_bt_xml: ""
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator" # 保持 /
    navigate_through_poses:
      plugin: "nav2_bt_navigator/NavigateThroughPosesNavigator" # 保持 /
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: false
    cmd_vel_topic: /cmd_vel_raw
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.05
    failure_tolerance: 1.0         # 给局部规划更多恢复空间，避免过早进入恢复树
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.12
      movement_time_allowance: 35.0
    # Goal checker parameters
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # ═══════════════════════════════════════════════════════════
    # Regulated Pure Pursuit
    # 更适合“先转向再前进”的前向导航，避免 DWB 在拐点反复左右试探
    # 自主导航阶段禁止横移和后退，降低侧后盲区风险
    # ═══════════════════════════════════════════════════════════
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.40
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.90
      lookahead_dist: 0.45
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.70
      lookahead_time: 1.0
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.2
      rotate_to_heading_angular_vel: 0.65
      rotate_to_heading_min_angle: 0.35
      use_rotate_to_heading: true
      allow_reversing: false
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.90
      regulated_linear_scaling_min_speed: 0.08
      use_collision_detection: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 15.0     # 更快刷新局部障碍，减少来不及避让的情况
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 5
      height: 5 
      resolution: 0.05
      # 正八边形 (边长22cm, 边到心26.55cm) + 轮子向外延伸至 半径30cm
      footprint: "[ [0.2655, -0.11], [0.2655, 0.11], [0.212, 0.212], [0.11, 0.2655], [-0.11, 0.2655], [-0.212, 0.212], [-0.2655, 0.11], [-0.2655, -0.11], [-0.212, -0.212], [-0.11, -0.2655], [0.11, -0.2655], [0.212, -0.212] ]"
      transform_tolerance: 0.5
      trinary_costmap: false

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /scan_filtered
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_min_range: 0.05
          obstacle_max_range: 10.0
          raytrace_min_range: 0.05
          raytrace_max_range: 12.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.36

      always_send_full_costmap: True


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 6.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      footprint: "[ [0.2655, -0.11], [0.2655, 0.11], [0.212, 0.212], [0.11, 0.2655], [-0.11, 0.2655], [-0.212, 0.212], [-0.2655, 0.11], [-0.2655, -0.11], [-0.212, -0.212], [-0.11, -0.2655], [0.11, -0.2655], [0.212, -0.212] ]"
      resolution: 0.05
      track_unknown_space: true
      transform_tolerance: 0.5
      trinary_costmap: false

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        subscribe_to_updates: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /scan_filtered
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_min_range: 0.05
          obstacle_max_range: 10.0
          raytrace_min_range: 0.05
          raytrace_max_range: 12.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.50

      always_send_full_costmap: True

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 6.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.20                  # 收紧容差，太大的容差会导致终点乱飘
      downsample_costmap: false        # false 可以保证规划更精确，不贴墙
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: -1
      max_on_approach_iterations: 1000
      max_planning_time: 2.5
      motion_model_for_search: "MOORE" # 8向搜索，适合全向车
      cost_travel_multiplier: 2.4      # 稍微更保守，减少贴墙路径
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5

      # --------- 核心：不贴墙配置 ---------
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
      cost_penalty: 1.2
      retrospective_penalty: 0.01

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother" # 保持 :: (已验证通过)
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: false
    cmd_vel_topic: /cmd_vel_raw
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin" # 修正为 /
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading" # 修正为 /
    wait:
      plugin: "nav2_behaviors/Wait" # 修正为 /
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop" # 修正为 /
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 1.0
    max_rotational_vel: 0.65
    min_rotational_vel: 0.10
    rotational_acc_lim: 1.20

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint" # 保持 :: (Humble下通常是这个)
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    feedback: "OPEN_LOOP"
    max_velocity: [0.50, 0.0, 0.65]
    min_velocity: [0.0, 0.0, -0.65]
    max_accel: [2.50, 2.50, 3.20]
    max_decel: [-2.50, -2.50, -3.20]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.35
    cmd_vel_in_topic: /cmd_vel_raw
    cmd_vel_out_topic: /cmd_vel_nav

# Collision Monitor - 实时碰撞监测，紧急停止
# 简化配置，避免启动问题
collision_monitor:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "/cmd_vel"
    cmd_vel_out_topic: "/cmd_vel_safe"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.5
    source_timeout: 2.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # 使用前向碰撞监测区域，减少侧墙对窄通道通行速度的干扰
    polygons: ["PolygonStop", "PolygonSlow"]
    PolygonStop:
      type: "polygon"
      # 仅监控机器人前向盲区，避免窄通道左右墙体长期触发减速
      points: [0.40, 0.28, 0.40, -0.28, 0.02, -0.28, 0.02, 0.28]
      action_type: "stop"
      max_points: 3
      visualize: True
      polygon_pub_topic: "polygon_stop"
      enabled: True
    PolygonSlow:
      type: "polygon"
      points: [0.80, 0.32, 0.80, -0.32, 0.02, -0.32, 0.02, 0.32]
      action_type: "slowdown"
      max_points: 3
      slowdown_ratio: 0.65
      visualize: True
      polygon_pub_topic: "polygon_slow"
      enabled: True
    # 仅使用激光雷达作为源
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan_filtered"
      min_height: 0.02
      max_height: 1.0
      enabled: True

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    # navigation_launch 只管理标准 Nav2 导航栈。
    # collision_monitor 使用独立 lifecycle manager 启动。
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
