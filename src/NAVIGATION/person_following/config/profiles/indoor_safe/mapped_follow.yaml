# nav_follow_interface.py
/**:
  ros__parameters:
    # HIGH IMPACT
    default_follow_mode: mapped
    goal_update_hz: 1.5
    min_goal_step_m: 0.25
    goal_resend_sec: 2.0
    max_goal_distance_m: 2.0

    # NORMAL TUNING
    goal_resend_cooldown_sec: 1.0
    goal_cancel_cooldown_sec: 0.8
    yaw_deadband_deg: 6.0
    angular_speed_min_rad_s: 0.12
    angular_speed_max_rad_s: 0.45
    search_goal_resend_sec: 3.0

    # NODE-LOCAL WIRING
    nav_available_topic: /person_follow/nav2_available
    tf_ok_topic: /person_follow/tf_ok
