# local_follow_interface.py
/**:
  ros__parameters:
    # HIGH IMPACT
    # Keep this consistent with safety.yaml unless mode switching is intentional.
    default_follow_mode: unmapped
    control_hz: 10.0
    max_linear_speed_mps: 0.32
    max_angular_speed_rad_s: 0.6
    distance_kp: 0.55
    yaw_kp: 1.1
    follow_distance_default_m: 0.85
    target_stale_timeout_sec: 1.0
    critical_stop_distance_m: 0.45
    slowdown_distance_m: 0.95
    bypass_trigger_sec: 1.4
    bypass_duration_sec: 1.2

    # NORMAL TUNING
    min_linear_speed_mps: 0.04
    scan_timeout_sec: 0.5
    depth_timeout_sec: 0.7
    corridor_half_width_m: 0.4
    corridor_lookahead_m: 1.2
    side_clearance_m: 0.6
    bypass_forward_speed_mps: 0.1
    bypass_turn_speed_rad_s: 0.38
    wait_before_bypass_sec: 0.7
    depth_stop_distance_m: 0.65
    depth_critical_distance_m: 0.42
    depth_center_ratio: 0.35
    depth_min_valid_pixels: 180

    # NODE-LOCAL WIRING
    obstacle_inhibit_topic: /person_follow/obstacle_inhibit
    local_sensing_ok_topic: /person_follow/local_sensing_ok
