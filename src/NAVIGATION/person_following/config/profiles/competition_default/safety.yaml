# safety_supervisor.py
/**:
  ros__parameters:
    # HIGH IMPACT
    # Keep this consistent with mapped/unmapped defaults unless mode switching is intentional.
    default_follow_mode: unmapped
    tracker_timeout_sec: 1.0
    target_soft_timeout_sec: 1.2
    target_hard_timeout_sec: 2.5
    tf_timeout_sec: 0.75
    nav_timeout_sec: 1.5
    obstacle_fault_timeout_sec: 3.0
    local_sensing_timeout_sec: 3.0

    # NODE-LOCAL WIRING
    behavior_status_topic: /person_follow/behavior_status
    nav_available_topic: /person_follow/nav2_available
    tf_ok_topic: /person_follow/tf_ok
    obstacle_inhibit_topic: /person_follow/obstacle_inhibit
    local_sensing_ok_topic: /person_follow/local_sensing_ok
