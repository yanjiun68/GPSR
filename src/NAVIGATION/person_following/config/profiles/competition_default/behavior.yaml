# follow_behavior_manager.py
/**:
  ros__parameters:
    # HIGH IMPACT
    follow_distance_m: 0.8
    lock_confirm_sec: 0.25
    target_soft_timeout_sec: 1.4
    target_hard_timeout_sec: 2.6
    search_timeout_sec: 8.0
    follow_confidence_min: 0.55
    cautious_confidence_min: 0.40
    stop_distance_m: 0.45
    hold_distance_m: 1.0
    nominal_speed_mps: 0.55
    cautious_speed_mps: 0.3

    # NORMAL TUNING
    face_hold_sec: 10.0
    translate_staleness_sec: 0.7
    rotate_bearing_deg: 32.0
    contradiction_rotate_delay_sec: 0.90
    rotate_yaw_enter_deg: 12.0
    rotate_yaw_exit_deg: 7.0
    search_rotate_speed_rad_s: 0.40

    # NODE-LOCAL WIRING
    behavior_status_topic: /person_follow/behavior_status
    target_distance_topic: /person_follow/target_distance_m
