# local_follow_interface.py
/**:
  ros__parameters:
    # HIGH IMPACT
    default_follow_mode: unmapped
    unmapped_backend: reactive      #mppi
    control_hz: 10.0
    goal_update_hz: 4.0
    goal_resend_sec: 2.0
    goal_min_step_m: 0.15
    goal_smoothing_alpha: 0.45
    max_local_goal_distance_m: 1.6
    follow_distance_default_m: 0.8
    target_stale_timeout_sec: 1.2

    # NORMAL TUNING
    goal_cancel_cooldown_sec: 0.4
    max_linear_speed_mps: 0.34
    max_angular_speed_rad_s: 0.55
    min_linear_speed_mps: 0.05
    distance_kp: 0.55
    yaw_kp: 0.90
    rotate_yaw_enter_deg: 12.0
    rotate_yaw_exit_deg: 7.0
    rotate_min_angular_speed_rad_s: 0.0
    scan_timeout_sec: 0.6
    depth_timeout_sec: 3.0
    corridor_half_width_m: 0.28
    corridor_lookahead_m: 1.4
    critical_stop_distance_m: 0.34
    slowdown_distance_m: 0.60
    side_clearance_m: 0.32
    bypass_trigger_sec: 1.2
    bypass_duration_sec: 1.4
    bypass_forward_speed_mps: 0.12
    bypass_turn_speed_rad_s: 0.45
    wait_before_bypass_sec: 0.45
    depth_stop_distance_m: 0.45
    depth_critical_distance_m: 0.34
    depth_center_ratio: 0.35
    depth_min_valid_pixels: 150
    target_mask_enabled: true
    target_mask_half_length_m: 0.40
    target_mask_half_width_m: 0.30
    depth_target_exclusion_margin_m: 0.30
    depth_min_obstacle_pixels: 120
    local_goal_frame: odom
    publish_debug_markers: true
    debug_markers_topic: /person_follow/unmapped_debug_markers
    debug_status_topic: /person_follow/local_debug

    # NODE-LOCAL WIRING
    obstacle_inhibit_topic: /person_follow/obstacle_inhibit
    local_sensing_ok_topic: /person_follow/local_sensing_ok
