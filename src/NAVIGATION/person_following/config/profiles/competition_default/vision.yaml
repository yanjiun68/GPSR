# vision_node.py
/**:
  ros__parameters:
    # HIGH IMPACT
    yolo_conf_thresh: 0.50
    enable_gui: true
    publish_markers: true
    min_depth_valid_ratio: 0.10
    retinaface_enabled: false
    retinaface_conf_thresh: 0.7
    retinaface_nms_iou: 0.4
    retinaface_every_n_frames: 12
    facing_yaw_thresh_deg: 25.0
    facing_pitch_thresh_deg: 20.0

    # NORMAL TUNING
    debug_mode: false
    locked_target_topic: /person_target_locked
    gui_lock_match_gate_m: 0.45
    gui_lock_timeout_sec: 0.65
    sync_queue: 10
    sync_slop_sec: 0.06
    marker_scale: 0.18
    marker_lifetime_sec: 0.5
    tf_timeout_sec: 0.1
    robot_radius_m: 0.2655
    depth_roi_scale_w: 0.4
    depth_roi_scale_h: 0.5
    retinaface_input_w: 640
    retinaface_input_h: 640
    runtime_timing_debug: false

    # ADVANCED
    retinaface_out_scores: ''
    retinaface_out_boxes: ''
    retinaface_out_landmarks: ''
    torso_region_height_ratio: 0.22
    upper_body_region_height_ratio: 0.18
    lower_body_region_height_ratio: 0.18
    hist_visible_ratio_min: 0.6
    face_embed_min_area_px: 1024.0
    face_embed_max_yaw_deg: 35.0
    face_embed_max_pitch_deg: 25.0
    identity_quality_min_for_update: 0.6
    crop_blur_max_laplacian: 45.0
    crop_min_bbox_area_px: 6000.0
    crop_min_visible_body_ratio: 0.55
    crop_aspect_ratio_min: 0.25
    crop_aspect_ratio_max: 0.8
