boundary_zone_checker:
  ros__parameters:
    global_frame: map
    base_frame: base_footprint
    boundary_event_topic: /person_follow/boundary_event
    boundary_status_topic: /person_follow/boundary_status
    hold_time_sec: 0.5
    initial_region: inside
    status_hz: 5.0
    zones:
      - name: door_exit_1
        role: exit
        x: 0.0
        y: 0.0
        radius_m: 0.8
      - name: door_enter_1
        role: enter
        x: 0.0
        y: 0.0
        radius_m: 0.8
