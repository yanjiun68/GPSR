# IMPORTANT: The polygons below are illustrative geometry, not competition-map coordinates.
# Replace every coordinate and verify every waypoint against the active map before robot use.
frames:
  map: map
  base: base_footprint

# Waypoint section: optional secondary proximity information scoped to a semantic room.
waypoints:
  kitchen_center:
    room: kitchen
    x: 2.0
    y: 2.0
  kitchen_table_observe:
    room: kitchen
    x: 1.5
    y: 1.5
  living_room_center:
    room: living_room
    x: 7.0
    y: 2.0

# Room section: polygon containment, never waypoint proximity, classifies the robot's room.
rooms:
  kitchen:
    polygon:
      - [0.0, 0.0]
      - [4.0, 0.0]
      - [4.0, 4.0]
      - [0.0, 4.0]
    default_waypoint: kitchen_center
    locations:
      kitchen_table:
        polygon:
          - [1.0, 1.0]
          - [2.0, 1.0]
          - [2.0, 2.0]
          - [1.0, 2.0]
        waypoint: kitchen_table_observe

  living_room:
    polygon:
      - [5.0, 0.0]
      - [9.0, 0.0]
      - [9.0, 4.0]
      - [5.0, 4.0]
    default_waypoint: living_room_center
    locations: {}
