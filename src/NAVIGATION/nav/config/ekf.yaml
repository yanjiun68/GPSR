ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    two_d_mode: true

    publish_tf: true
    publish_acceleration: false

    map_frame: map 
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # ---------------------------------
    # Wheel Odometry (velocity only)
    # ---------------------------------
    odom0: /odom
    odom0_config:
      [false, false, false,
       false, false, false,
       true,  true,  false,
       false, false, false,
       false, false, false]
    odom0_queue_size: 10
    odom0_differential: false

    # ---------------------------------
    # RealSense Gyro (yaw rate only)
    # ---------------------------------
    imu0: /camera/camera/gyro/sample
    imu0_config:
      [false, false, false,
       false, false, false,
       false, false, false,
       false, false, true,
       false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10
