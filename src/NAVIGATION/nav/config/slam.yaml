slam_toolbox:
  ros__parameters:

    # ---------- Frames / Topics ----------
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint          # change to base_link if your TF uses base_link
    scan_topic: /scan

    # mapping / localization
    mode: mapping

    # ---------- General ----------
    debug_logging: false
    throttle_scans: 1                   # 1 = use every scan, 2 = every 2 scans (CPU saving)
    transform_publish_period: 0.02      # publish map->odom at 50Hz
    tf_buffer_duration: 30.0
    transform_timeout: 0.2
    map_update_interval: 1.0            # seconds (increase to 2.0 if CPU weak)
    resolution: 0.05
    min_laser_range: 0.20   # or 0.25 if you see noisy close points
    max_laser_range: 8.0    # recommended indoors (cleaner than using full 12m)
    minimum_time_interval: 0.0

    # If you ALREADY publish odom->base_footprint from your wheel/imu odom node, keep this FALSE.
    # slam_toolbox will publish map->odom (that’s what Nav2 needs). :contentReference[oaicite:1]{index=1}
    provide_odom_frame: false

    # Wheel odometry helps a LOT for stable maps
    use_odometry: true
    use_scan_matching: true

    # Usually TRUE is best (uses TF to put scans correctly)
    use_tf_scan_transformation: true
    use_scan_barycenter: true

    # ---------- Motion filtering (IMPORTANT for "重合/叠图 noise") ----------
    # If too small, it updates too often and amplifies odom noise → map looks “fuzzy / double walls”.
    minimum_travel_distance: 0.08       # meters (try 0.05~0.15)
    minimum_travel_heading: 0.08        # radians (~4.6 deg) (try 0.05~0.15)

    # ---------- Scan buffer / loop closure ----------
    scan_buffer_size: 30
    scan_buffer_maximum_scan_distance: 8.0

    # Link matching (local constraints)
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5

    # Loop closing (global consistency)
    do_loop_closing: true
    loop_search_maximum_distance: 6.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # ---------- Correlation / search tuning ----------
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # ---------- Penalize crazy jumps ----------
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5

    # ---------- Scan matcher angles ----------
    fine_search_angle_offset: 0.00349   # ~0.2 deg
    coarse_search_angle_offset: 0.349   # ~20 deg
    coarse_angle_resolution: 0.0349     # ~2 deg

    # ---------- Solver ----------
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ---------- Interactive mode ----------
    enable_interactive_mode: false
    paused_new_measurements: false
    stack_size_to_use: 40000000

    # ---------- Optional: continue / serialize mapping ----------
    # Put a path PREFIX (slam_toolbox will use it for posegraph serialization)
    # map_file_name: /home/<YOU>/maps/my_map_session
    # map_start_pose: [0.0, 0.0, 0.0]
    # map_start_at_dock: false
