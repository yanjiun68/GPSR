# nav2_params.yaml (ROS2 Humble) — SLAM mode (slam_toolbox provides /map + map->odom)
# Start with LiDAR only. Voxel layer section is included but OPTIONAL.

amcl:  # not used in SLAM mode
  ros__parameters:
    use_sim_time: false

map_server:  # not used in SLAM mode
  ros__parameters:
    use_sim_time: false

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.20
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller/RegulatedPurePursuitController"
      desired_linear_vel: 0.45
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 1.2
      use_velocity_scaled_lookahead_dist: true

      max_angular_accel: 3.2
      rotate_to_heading_angular_vel: 1.2
      transform_tolerance: 0.2

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      regulate_turning: true
      regulate_linear_velocity: true
      inflation_cost_scaling_factor: 3.0

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: "map"
    robot_base_frame: "base_footprint"   # change to base_link if your robot uses base_link
    transform_timeout: 0.2
    simulate_ahead_time: 1.0
    max_rotational_vel: 1.2
    min_rotational_vel: 0.2
    rotational_acc_lim: 3.2

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: "map"
    robot_base_frame: "base_footprint"   # change if needed
    odom_topic: "/odom"
    bt_loop_duration: 10
    default_server_timeout: 20
    # default Nav2 BTs:
    default_nav_to_pose_bt_xml: "nav2_bt_navigator/behavior_trees/navigate_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.6, 0.0, 1.5]   # [vx, vy, wz]
    min_velocity: [0.0, 0.0, -1.5]
    max_accel:    [1.5, 0.0, 3.2]
    max_decel:    [-1.5, 0.0, -3.2]
    odom_topic: "/odom"
    velocity_timeout: 1.0

# ---------------- COSTMAPS ----------------

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: "map"
      robot_base_frame: "base_footprint"   # change if needed
      update_frequency: 5.0
      publish_frequency: 2.0
      resolution: 0.05
      track_unknown_space: true
      rolling_window: false

      robot_radius: 0.22  # <-- IMPORTANT: set to your real robot radius (meters)
      # OR use footprint instead of robot_radius:
      # footprint: "[[0.20, 0.15], [0.20, -0.15], [-0.20, -0.15], [-0.20, 0.15]]"

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "scan"
        scan:
          topic: "/scan"
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_max_range: 3.5
          obstacle_min_range: 0.05
          raytrace_max_range: 4.0
          raytrace_min_range: 0.05

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: "odom"
      robot_base_frame: "base_footprint"   # change if needed
      update_frequency: 10.0
      publish_frequency: 5.0
      resolution: 0.05
      rolling_window: true
      width: 6.0
      height: 6.0

      robot_radius: 0.22

      plugins: ["obstacle_layer", "inflation_layer"]
      # If you enable voxel layer, use:
      # plugins: ["obstacle_layer", "voxel_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: "scan"
        scan:
          topic: "/scan"
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_max_range: 3.0
          obstacle_min_range: 0.05
          raytrace_max_range: 3.5
          raytrace_min_range: 0.05

      # ---------- OPTIONAL: VOXEL LAYER (RealSense PointCloud2) ----------
      # voxel_layer:
      #   plugin: "nav2_costmap_2d::VoxelLayer"
      #   enabled: true
      #   footprint_clearing_enabled: true
      #   max_obstacle_height: 2.0
      #   origin_z: 0.0
      #   z_resolution: 0.05
      #   z_voxels: 16
      #   mark_threshold: 0
      #   observation_sources: "depth_points"
      #   depth_points:
      #     topic: "/camera/depth/color/points"   # <-- change to your PointCloud2 topic
      #     data_type: "PointCloud2"
      #     marking: true
      #     clearing: true
      #     obstacle_max_range: 2.5
      #     obstacle_min_range: 0.2

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45
        cost_scaling_factor: 3.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - planner_server
      - controller_server
      - smoother_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
      - global_costmap
      - local_costmap
