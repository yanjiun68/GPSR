# Parameters for the follow-and-return-home session stack:
#   cmd_vel_mux               -- mode-gated Twist multiplexer
#   return_safety_wrapper     -- lidar obstacle-scaled pass-through for
#                                 breadcrumb's raw return-home cmd_vel
#   session_manager           -- session lifecycle state machine
#
# All three are in the person_follower_master package and all three expect
# /scan_filtered + /odom + the stock breadcrumb_teach_repeat node.

cmd_vel_mux:
  ros__parameters:
    follow_topic: "/cmd_vel_follow"
    return_topic: "/cmd_vel_return"
    output_topic: "/cmd_vel_safe"
    mode_topic: "/session_manager/mode"
    master_topic: "/master_target"
    active_source_topic: "/cmd_vel_mux/active_source"
    publish_rate_hz: 30.0
    # If the active source has not published within this window the mux
    # outputs zero. Keep tight — this is the primary "something died" guard.
    source_watchdog_sec: 0.25
    # If the mode topic has been silent this long we assume session_manager
    # has died and output zero regardless of the last known mode.
    mode_watchdog_sec: 3.0
    # TEACHING-only: if the master has been LOST / stream-silent continuously
    # for this many seconds, the mux swallows /cmd_vel_follow and outputs
    # zero. Purpose: follow_controller starts scan-rotating at ~2 s of loss,
    # and those rotations would be recorded into the breadcrumb path and
    # replayed during RETURN — leaving the robot spinning in place at the
    # loss point instead of finding home. Keep this slightly under 2.0.
    # Short dropouts (single missed frame) pass through unaffected because
    # the grace window doesn't start until continuous loss is detected.
    master_lost_grace_sec: 1.8
    master_stream_silence_sec: 1.0

return_safety_wrapper:
  ros__parameters:
    input_topic: "/cmd_vel_return_raw"
    output_topic: "/cmd_vel_return"
    scan_topic: "/scan_filtered"
    mode_topic: "/session_manager/mode"
    blocked_sec_topic: "/return_safety/blocked_sec"
    status_topic: "/return_safety/status"
    publish_rate_hz: 20.0

    # Forward cone half-width for "is the path ahead clear?".
    obstacle_cone_deg: 35.0
    # Linear velocity scales linearly between stop_range..slow_start_range.
    slow_start_range: 1.20
    stop_range: 0.35
    # Any obstacle within emergency_range — in any direction — freezes all
    # velocities (linear and angular). This protects against something
    # suddenly appearing on the side during an in-place rotation.
    emergency_range: 0.25
    # Floor on the linear scale so we never crawl at pointlessly low speeds.
    min_linear_scale: 0.15

    cmd_watchdog_sec: 0.4
    scan_watchdog_sec: 0.5
    # If we've been blocked (STOP/EMERGENCY/EVADE) continuously this long we
    # emit the ABORT status; session_manager latches STOPPED on that signal.
    abort_timeout_sec: 60.0
    # Reserved for future hysteresis tuning.
    clear_hysteresis_sec: 0.5

    # EVADE: static-obstacle bypass via lateral strafe + forward creep.
    # Assumes an omni/mecanum base (true on this X-drive). After stopping in
    # front of an obstacle for evade_after_sec we look left vs right and,
    # if one side is provably clearer, strafe that way while the breadcrumb
    # controller keeps regulating heading on the path.
    enable_evade: true
    evade_after_sec: 3.0            # stop-and-wait grace before attempting bypass
    evade_speed: 0.12               # lateral strafe speed, m/s
    evade_forward_creep: 0.04       # small forward velocity during bypass, m/s
    evade_side_cone_deg: 35.0       # half-width of the left/right sampling cone
    evade_side_clearance_m: 0.45    # side must be clearer than this to pick it
    evade_side_abort_m: 0.25        # chosen side closing in below this → abort
    evade_clear_margin_m: 0.55      # forward clear above this exits EVADE (hysteresis)
    evade_max_distance_m: 0.60      # total lateral strafe budget before giving up
    evade_max_duration_sec: 8.0     # time budget before reverting to STOP

session_manager:
  ros__parameters:
    mode_topic: "/session_manager/mode"
    state_topic: "/session_manager/state"
    diagnostics_topic: "/session_manager/diagnostics"
    master_target_topic: "/master_target"
    breadcrumb_pose_topic: "/breadcrumb_loc_pose"
    return_cmd_raw_topic: "/cmd_vel_return_raw"
    return_safety_status_topic: "/return_safety/status"

    breadcrumb_start_teach_srv: "/breadcrumb_teach_repeat/start_teach"
    breadcrumb_finish_teach_srv: "/breadcrumb_teach_repeat/finish_teach"
    breadcrumb_start_repeat_srv: "/breadcrumb_teach_repeat/start_repeat"
    breadcrumb_stop_srv: "/breadcrumb_teach_repeat/stop"

    # Go_home gesture: master stands facing the robot, still, for
    # auto_go_home_on_still_sec. The intentional "I'm here, take me home"
    # signal — walk in front, stop, hold 5 s, robot starts returning.
    # Set to 0 to disable (then only /return_home/go_home arms RETURNING).
    #
    # We deliberately do NOT auto-fire on master-lost: while LOST,
    # follow_controller scan-rotates the robot in place, and breadcrumb
    # records those rotations into the taught path. Replaying a path
    # poisoned with scan-rotate spins would leave the robot spinning at
    # the loss point instead of finding home. If the operator can't do
    # the gesture, /return_home/go_home is always available.
    auto_go_home_on_still_sec: 5.0
    auto_go_home_still_max_bearing: 0.30   # rad — |bearing|<=0.30 is "facing" (~17°)
    auto_go_home_still_min_dist: 0.8       # m — too close likely a hand, ignore
    auto_go_home_still_max_dist: 2.0       # m — too far likely just paused walk
    auto_go_home_still_max_speed: 0.12     # m/s — relative speed cap for "still"

    # Auto-start TEACHING the moment the master_tracker reports a locked
    # master. Hands-free UX: boot the stack, stand in front for 3 s, robot
    # enrolls AND starts following + recording the return path. No service
    # call needed. Set to false if you want /return_home/start to be the
    # only way to arm TEACHING.
    auto_start_on_master_enroll: true
    auto_start_hold_sec: 0.5            # debounce past enrollment
    auto_start_retry_sec: 3.0           # min gap between attempts if rejected

    # Arrival detection. breadcrumb publishes /breadcrumb_loc_pose in its
    # 'breadcrumb_map' frame with breadcrumbs[0] anchored at origin, so the
    # home pose is always (0, 0, 0) in that frame — distance is just ‖(x,y)‖.
    arrival_tol_m: 0.25
    arrival_tol_yaw: 0.35
    arrival_hold_sec: 1.5
    arrival_zero_cmd_sec: 0.8
    arrived_quiesce_sec: 2.0

    # Global timeout on RETURNING. Budget = max(floor, ratio * teach_duration).
    repeat_timeout_ratio: 3.0
    repeat_timeout_floor_sec: 60.0
    service_wait_sec: 5.0

    tick_rate_hz: 5.0

breadcrumb_teach_repeat:
  ros__parameters:
    # Overrides applied to the stock breadcrumb node when launched from
    # person_follow_return.launch.py. The important ones:
    #   cmd_vel_topic            -- route breadcrumb's raw output into the
    #                                 return_safety_wrapper (NOT /cmd_vel).
    #   scan_topic               -- use the self-filtered scan so footprint
    #                                 returns never poison the local map.
    #   publish_start_pose_on_finish -- re-seed AMCL at home so any
    #                                 downstream Nav2 session can resume.
    odom_topic: "/odom"
    scan_topic: "/scan_filtered"
    cmd_vel_topic: "/cmd_vel_return_raw"
    initial_pose_topic: "/initialpose"
    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_footprint"
    route_frame: "breadcrumb_map"
    # Persistent storage. The default /tmp path is lost on reboot.
    # ~ is expanded by rclpy only if wrapped — we use an absolute path.
    route_file: "/var/tmp/person_follower_master_breadcrumb_route.yaml"
    autoload_route: false
    autosave_route: true
    publish_start_pose_on_finish: true
    publish_tf: false
    heading_mode: "path_tangent"
    allow_reverse: false

    # Recording density — 30 cm between breadcrumbs and/or 20° yaw change.
    record_distance: 0.30
    record_yaw: 0.35
    max_route_breadcrumbs: 4000
    grid_resolution: 0.05

    # Repeat-time speed limits. Breadcrumb itself has no obstacle layer,
    # so keep commands conservative — return_safety_wrapper still scales
    # these further when needed.
    target_reach_distance: 0.22
    final_goal_tolerance: 0.16
    lookahead_distance: 0.45
    slowdown_radius: 0.55
    rotate_in_place_angle: 0.65
    max_linear_speed: 0.18
    max_lateral_speed: 0.12
    max_angular_speed: 0.70
    # Reject per-tick scan-match xy jitter on the strafe channel. Without
    # this, ~5 cm observation noise in /breadcrumb_loc_pose was amplified
    # by lateral_gain*max_lateral_speed into saturated ±vy sign-flipping
    # while driving (the "snaking left-right" symptom during RETURN).
    # Verified in /tmp/verify_snake_fix.py on the real 9-bc route.
    lateral_deadband: 0.10

    # --- Scan-match yaw-jump mitigation (Layer 1) ---
    # On-hardware diag confirmed scan-match emits 0.10-0.20 rad per-tick
    # yaw jumps during the initial π-rotation at return start, around the
    # ±π heading_target boundary. These jumps flip heading_error sign
    # tick-to-tick, flipping wz between ±max_angular_speed — this was the
    # dominant cause of the snake the deadband did not fix.
    #
    # yaw_filter_alpha: low-pass coeff in yaw = α*raw + (1-α)*prev.
    #   0.35 rejects ~0.2 rad spikes while still tracking 0.7 rad/s true
    #   rotation at 20 Hz (τ ≈ 3 ticks = 0.15 s lag — acceptable).
    yaw_filter_alpha: 0.35
    # rotate_enter/exit_angle: hysteresis band for the rotate-in-place
    #   velocity scale (×0.25). Enter rotate when |he| > enter, exit only
    #   after |he| < exit for dwell_ticks. Prevents boundary flip-flop.
    rotate_enter_angle: 0.85
    rotate_exit_angle: 0.55
    rotate_exit_dwell_ticks: 3
    # wz_sign_latch_release_angle: while rotating, block wz sign reversal
    #   until |he| shrinks below this. If the P-law would flip wz because
    #   of a yaw jump, hold wz=0 for that tick instead.
    wz_sign_latch_release_angle: 0.35

    # --- Rotation shim (Layer 2, Nav2-style pre-tracking rotation) ---
    # Layer 1 smooths scan-match yaw but doesn't fix its root instability:
    # during the initial π-rotation at RETURN start, consecutive lidar
    # scans share little structure with the taught scan so the scan-match
    # yaw output flickers across the ±π discontinuity, flipping wz sign
    # tick-to-tick. Layer 2 is Nav2's recognized fix (Rotation Shim
    # Controller pattern): before pure-pursuit engages, run an open-loop
    # rotate-in-place stage under ODOMETRY yaw feedback. Odom yaw is
    # continuously integrated on the robot, never wraps at ±π in the
    # controller, so the singularity is structurally absent.
    #
    # How it works: at start_repeat we lock (a) current odom yaw, (b) the
    # signed rotation required (heading_target minus scan-match yaw —
    # a single sample taken when robot is stationary, so reliable). Each
    # tick during shim: remaining = wrap(required - (odom_yaw -
    # odom_yaw_start)); wz = gain * remaining, vx = vy = 0. Exit when
    # |remaining| < exit_angle for dwell_ticks consecutive ticks. Shim
    # is only armed when |required_delta| > entry_angle — small initial
    # turns pass through to normal control as before.
    rotation_shim_enabled: true
    rotation_shim_entry_angle: 0.85    # rad — only arm if initial turn is large
    rotation_shim_exit_angle: 0.30     # rad — hand off to pure-pursuit below this
    rotation_shim_exit_dwell_ticks: 3
    rotation_shim_wz_gain: 1.2         # higher than yaw_gain; we're open-loop on odom

    # --- Pose source for the repeat controller ---
    # The failure that motivated Layer 1 + Layer 2 was scan-match yaw
    # jumps across ±π during the initial rotation at RETURN start; both
    # layers tried to harden the controller against that jumpy input.
    # 'odom' sidesteps the problem at the architecture level: during
    # repeat the controller reads only dead-reckoned odometry. Breadcrumbs
    # were already stored as odom-deltas from teach start, so their frame
    # matches natively. Yaw drift for mecanum indoor is ~1%/m — fine for
    # tens-of-metres routes.  Switch back to 'scan_match' only if odom
    # becomes unreliable.
    replay_pose_source: "odom"

follow_controller_node:
  ros__parameters:
    # Override the default cmd_vel_topic so follow_controller publishes into
    # the mux's follow channel instead of the final /cmd_vel.
    cmd_vel_topic: "/cmd_vel_follow"
    # Cap forward speed while following. Default 0.40 felt too fast on the
    # physical base; 0.35 keeps the person comfortably ahead at walking pace.
    v_max: 0.35
