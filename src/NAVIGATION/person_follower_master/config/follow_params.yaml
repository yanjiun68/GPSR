master_tracker_node:
  ros__parameters:
    odom_frame: "odom"
    base_frame: "base_footprint"
    detections_topic: "/cam_detections_reid"
    assoc_alpha_motion: 1.0
    assoc_beta_reid: 2.0
    gate_mahalanobis: 9.21
    gate_reid: 0.50
    sigma_p: 0.30
    sigma_v: 0.50
    meas_std: 0.08
    tentative_hits: 3
    confirmed_lost_limit: 8
    delete_lost_limit: 80
    min_gallery_bbox_area: 2500
    gallery_size: 10
    master_gallery_size: 30
    enroll_min_dist: 0.8
    enroll_max_dist: 2.0
    enroll_bearing_deg: 15.0
    enroll_stable_sec: 3.0
    relock_min_sim: 0.75
    relock_margin: 0.10
    keep_min_sim: 0.65
    lost_hold_sec: 0.5
    recovery_max_sim_gate: 0.72
    recovery_sim_floor: 0.62
    recovery_sim_decay: 0.005
    recovery_max_dist: 5.0
    recovery_dist_growth: 0.50
    lost_timeout_sec: 10.0
    publish_rate_hz: 20.0
    high_quality_bbox_area: 4000
    high_quality_sim: 0.80
    ambig_iou_threshold: 0.15
    master_sim_clear: 0.55
    master_margin_clear: 0.08
    master_sim_ambig: 0.70
    master_margin_ambig: 0.15

reid_enricher_node:
  ros__parameters:
    rgb_topic: "/camera/camera/color/image_raw"
    detections_topic: "/cam_detections"
    output_topic: "/cam_detections_reid"
    min_bbox_area: 1500
    max_detections: 8
    time_slop_sec: 0.05
    rgb_buffer_size: 15
    reid_warmup: true
    model_name: "osnet_x0_25"
    num_threads: 2
    device: "cuda"   # auto-fallback to cpu if torch.cuda is unavailable

follow_controller_node:
  ros__parameters:
    control_rate_hz: 20.0
    d_target: 1.20
    d_deadzone: 0.15
    kp_v: 0.80
    kp_w: 1.80
    v_max: 0.40
    w_max: 0.80
    accel_v_max: 1.50
    accel_w_max: 3.00
    bearing_turn_in_place_deg: 45.0
    bearing_deadzone_deg: 5.0
    obstacle_cone_deg: 30.0
    obstacle_min_range: 0.30
    lost_hold_sec: 2.0
    lost_face_back_deg: 10.0
    lost_face_back_max_sec: 2.0
    scan_omega: 0.25
    scan_flip_period_sec: 12.0
    scan_pause_period_sec: 3.0
    scan_pause_sec: 0.8
    master_watchdog_sec: 0.5
    cmd_vel_topic: "/cmd_vel_safe"
    scan_topic: "/scan"
    master_topic: "/master_target"
